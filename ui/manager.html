<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>归藏 · 书库</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="app.css?v=117" />
</head>

<body>
  <div class="app">
    <header class="topbar" id="topbar"></header>
    <div class="manager-body">
      <nav class="rail" id="railPane">
        <div class="rail-scroll" id="rail"></div>
        <div class="rail-foot" id="railFoot"></div>
      </nav>
      <div class="resizer" id="railResizer" title="拖动调节书架宽度（双击重置）"></div>
      <main class="list-pane">
        <div class="list-head-host" id="listHead"></div>
        <div id="filterBarHost"></div>
        <div id="scanHost"></div>
        <div class="col-head-host" id="colHeadHost"></div>
        <div class="list-scroll" id="list"></div>
      </main>
      <div class="resizer" id="inspResizer" title="拖动调节检查器宽度（双击重置）" hidden></div>
      <aside class="inspector" id="inspector" hidden></aside>
    </div>
    <div id="mobileOverlay" class="mobile-overlay" hidden></div>
  </div>
  <div class="ctx-menu" id="ctxMenu" hidden></div>
  <div class="triage-overlay" id="triageOverlay" hidden></div>
  <div class="modal" id="modal" hidden>
    <div class="sheet" id="sheet"></div>
  </div>
  <div id="toast"></div>
  <script type="module" src="manager.js"></script>
</body>

</html>
